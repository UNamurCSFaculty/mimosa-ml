name: Publish release to PyPI

on:
  push:
    tags:
      # Version tags. Deliberately loose: releases are tagged v0.4.0-alpha, which the stricter
      # PEP 440 patterns in uv's template would not match.
      - "v*"

env:
  # The smoke tests run docs/examples/level1/basic_example.py, which calls plt.show().
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build
        run: uv build

      # No tests/ yet, so the example doubles as the smoke test: it exercises generate_data,
      # UnionGrid/RegularGrid/MergedGrid, BasicModel.fit/predict, save_csv/load_csv and plotting.
      # Run against the built distributions rather than the checkout, on both ends of the supported
      # Python range -- 3.10 resolves jax 0.6.2, 3.14 resolves jax 0.11.1.
      - name: Smoke test (wheel, Python 3.10)
        run: uv run --isolated --no-project --python 3.10 --with dist/*.whl docs/examples/level1/basic_example.py

      - name: Smoke test (wheel, Python 3.14)
        run: uv run --isolated --no-project --python 3.14 --with dist/*.whl docs/examples/level1/basic_example.py

      # The sdist and the wheel install the same code, so this checks the sdist builds at all,
      # not the Python range again.
      - name: Smoke test (source distribution, Python 3.14)
        run: uv run --isolated --no-project --python 3.14 --with dist/*.tar.gz docs/examples/level1/basic_example.py

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        run: uv publish
